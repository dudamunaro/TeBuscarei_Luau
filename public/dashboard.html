<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#a85b1b">
    <title>Painel administrativo | Luau — Te Buscarei</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="luau.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard-page">
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Luau — início">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>LU<em>AU</em></span>
        </a>

        <nav aria-label="Navegação principal">
            <a href="index.html">Ver site</a>
            <a href="contato.html">Contatos</a>
            <button class="logout-button" id="logout" type="button">Sair</button>
        </nav>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-intro">
            <p class="eyebrow"><span></span> Luau · Te Buscarei <span></span></p>
            <h1>Painel administrativo</h1>
            <p>Consulte as inscrições cadastradas e exporte os dados para uma planilha.</p>
        </section>

        <section class="dashboard-tools" aria-label="Resumo e exportação">
            <p id="resumo" class="summary">Total de inscritos: 0</p>
            <button class="export-button" id="exportar" type="button">Exportar para Excel <span aria-hidden="true">↓</span></button>
        </section>

        <section id="lista" class="registration-list" aria-live="polite" aria-label="Lista de inscritos"></section>
    </main>

    <footer class="site-footer">
        <span class="footer-star" aria-hidden="true">✦</span>
        <p>Luau · Te Buscarei</p>
    </footer>

    <script>
        let dadosInscritos = [];

        async function carregar() {
            const lista = document.getElementById("lista");
            lista.innerHTML = "";

            try {
                const response = await fetch("/admin/inscritos");
                if (!response.ok) {
                    throw new Error("Não foi possível carregar as inscrições.");
                }

                const data = await response.json();
                const grupos = [
                    ["11 a 14 anos", data.faixa11a14 || []],
                    ["15 anos ou mais", data.faixa15Mais || []]
                ];

                dadosInscritos = data.todos || [];
                document.getElementById("resumo").textContent = `Total de inscritos: ${dadosInscritos.length}`;

                grupos.forEach(([titulo, pessoas]) => {
                    if (!pessoas.length) return;

                    const grupo = document.createElement("section");
                    grupo.className = "registration-group";
                    const heading = document.createElement("h2");
                    heading.textContent = `${titulo} (${pessoas.length})`;
                    grupo.appendChild(heading);

                    pessoas.forEach((pessoa) => {
                        const card = document.createElement("article");
                        card.className = "registration-card";

                        const nome = document.createElement("h3");
                        nome.textContent = pessoa.nome || "Sem nome";
                        card.appendChild(nome);

                        const campos = [
                            ["Idade", pessoa.idade],
                            ["Telefone", pessoa.telefone_participante],
                            ["Responsável", pessoa.nome_responsavel],
                            ["Telefone do responsável", pessoa.telefone_responsavel],
                            ["Já fez retiro", pessoa.ja_fez_retiro],
                            ["Qual retiro", pessoa.qual_retiro],
                            ["Restrição", pessoa.restricao_saude],
                            ["Medicação", pessoa.medicacao]
                        ];

                        campos.forEach(([label, valor]) => {
                            const linha = document.createElement("p");
                            const nomeCampo = document.createElement("strong");
                            nomeCampo.textContent = `${label}: `;
                            linha.append(nomeCampo, document.createTextNode(valor || "Não informado"));
                            card.appendChild(linha);
                        });

                        const deleteButton = document.createElement("button");
                        deleteButton.className = "delete-registration-button";
                        deleteButton.type = "button";
                        deleteButton.textContent = "Apagar inscrição";
                        deleteButton.addEventListener("click", () => apagarInscricao(pessoa));
                        card.appendChild(deleteButton);

                        grupo.appendChild(card);
                    });

                    lista.appendChild(grupo);
                });

                if (!lista.children.length) {
                    const vazio = document.createElement("p");
                    vazio.className = "empty-state";
                    vazio.textContent = "Nenhum inscrito encontrado.";
                    lista.appendChild(vazio);
                }
            } catch (error) {
                dadosInscritos = [];
                document.getElementById("resumo").textContent = "Não foi possível carregar as inscrições.";
                const erro = document.createElement("p");
                erro.className = "empty-state error-state";
                erro.textContent = "Verifique a conexão com o servidor e tente novamente.";
                lista.replaceChildren(erro);
            }
        }

        async function apagarInscricao(pessoa) {
            const confirmado = window.confirm(
                `Tem certeza que deseja apagar a inscrição de ${pessoa.nome || "Sem nome"}? Esta ação não pode ser desfeita.`
            );

            if (!confirmado) return;

            try {
                const response = await fetch(`/admin/inscritos/${encodeURIComponent(pessoa.id)}`, {
                    method: "DELETE"
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.erro || "Não foi possível apagar a inscrição.");
                }

                await carregar();
            } catch (error) {
                window.alert(error.message || "Não foi possível conectar ao servidor. Tente novamente.");
            }
        }

        function exportarCSV() {
            if (!dadosInscritos.length) {
                alert("Não há inscritos para exportar.");
                return;
            }

            const colunas = [
                "Nome",
                "Idade",
                "Nome do responsável",
                "Telefone do responsável",
                "Telefone do participante",
                "Já fez retiro",
                "Qual retiro",
                "Restrição de saúde",
                "Medicação"
            ];

            const escaparHtml = (valor) => String(valor || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
            const linhas = dadosInscritos.map((pessoa) => [
                pessoa.nome,
                pessoa.idade,
                pessoa.nome_responsavel,
                pessoa.telefone_responsavel,
                pessoa.telefone_participante,
                pessoa.ja_fez_retiro,
                pessoa.qual_retiro,
                pessoa.restricao_saude,
                pessoa.medicacao
            ]);

            const html = [
                "<html><head><meta charset='utf-8'></head><body><table border='1'>",
                "<tr>" + colunas.map((coluna) => `<th>${escaparHtml(coluna)}</th>`).join("") + "</tr>",
                ...linhas.map((linha) => "<tr>" + linha.map((valor) => `<td>${escaparHtml(valor)}</td>`).join("") + "</tr>"),
                "</table></body></html>"
            ].join("");
            const blob = new Blob([html], { type: "application/vnd.ms-excel;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "inscritos.xls";
            link.click();
            URL.revokeObjectURL(url);
        }

        fetch("/admin/session")
            .then((response) => {
                if (!response.ok) {
                    window.location.replace("/admin");
                    return;
                }

                carregar();
            })
            .catch(() => {
                window.location.replace("/admin");
            });

        document.getElementById("exportar").addEventListener("click", exportarCSV);
        document.getElementById("logout").addEventListener("click", async () => {
            try {
                const response = await fetch("/logout", { method: "POST" });
                if (!response.ok) {
                    throw new Error("Não foi possível encerrar a sessão no servidor.");
                }
            } catch (error) {
                console.error(error);
            } finally {
                window.location.href = "/admin";
            }
        });
    </script>
</body>

</html>
